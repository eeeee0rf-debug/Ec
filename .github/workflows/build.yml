name: EC CS2 Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Merge & Extract
      run: |
        $part1 = [System.IO.File]::ReadAllBytes("EC-CS2-part1.zip")
        $part2 = [System.IO.File]::ReadAllBytes("EC-CS2-part2.zip")
        $merged = $part1 + $part2
        [System.IO.File]::WriteAllBytes("EC-CS2.zip", $merged)
        Expand-Archive -Path "EC-CS2.zip" -DestinationPath "extracted" -Force
        Get-ChildItem "extracted\EC-CS2-Project\" | ForEach-Object {
          if (-not (Test-Path ".\$($_.Name)")) {
            Move-Item -Path $_.FullName -Destination "." -Force
          }
        }
        Copy-Item -Path "extracted\EC-CS2-Project\.github" -Destination "." -Recurse -Force -ErrorAction SilentlyContinue

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: |
        Get-ChildItem -Recurse -Filter "*.sln" | Select-Object FullName
        Get-ChildItem -Recurse -Filter "*.vcxproj" | Select-Object FullName
        msbuild "EC-CS2.sln" /p:Configuration=Release /p:Platform=x64 /m /nologo

    - name: Collect output
      run: |
        New-Item -ItemType Directory -Force -Path "output"
        Copy-Item -Path "x64\Release\*.dll" -Destination "output\" -ErrorAction SilentlyContinue
        Copy-Item -Path "x64\Release\*.exe" -Destination "output\" -ErrorAction SilentlyContinue

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EC-CS2-${{ github.sha }}
        path: output/
        retention-days: 30
